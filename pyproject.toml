[project]
name = "astrapi-admin-agent"
version = "0.1.0"
description = "astrapi-admin – Agent für Paket-Baseline/Config-Dateien/Services (Linux-Pendant zum Windows-GPO-Client)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
astrapi-admin-agent = "astrapi_admin_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrapi_admin_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
